<!doctype html>
<html lang="en">
  <head>
    <!-- https://web.archive.org/web/20250422133213/https://stopwatch.blsglobal.net/ -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#142238" />
    <title>Velodrome Countdown</title>
    <style>
      @font-face {
        font-family: "DSEG7ClassicMini";
        src: url("./font/DSEG7ClassicMini-BoldItalic.woff2") format("woff2");
        font-weight: 700;
        font-style: italic;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0d1727;
        color: #eef4ff;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      main {
        width: min(760px, 100%);
        background: #142238;
        border: 1px solid #344a68;
        border-radius: 18px;
        padding: clamp(18px, 4vw, 30px);
        box-shadow: 0 18px 60px #0004;
      }
      h1 {
        margin: 0 0 6px;
        font-size: clamp(1.5rem, 4vw, 2rem);
      }
      .subtitle {
        color: #b5c5dc;
        margin: 0 0 24px;
      }
      .clock-frame {
        width: min(100%, 560px);
        margin: 24px auto;
        padding: 12px 18px;
        border-width: 12px;
        border-style: solid;
        border-color: #bd3d1c;
        border-radius: 4px;
        background: #171716;
        box-shadow: inset 0 0 0 1px #35221a;
        text-align: center;
        display: grid;
        place-items: center;
      }
      .clock-display,
      .clock-ghost {
        display: block;
        grid-area: 1 / 1;
        font-family: "DSEG7ClassicMini", monospace;
        font-size: 13rem;
        font-style: italic;
        font-weight: 700;
        line-height: 1;
      }
      .clock-display {
        color: #ffd15a;
        position: relative;
        z-index: 1;
        text-shadow:
          0 0 2px #ffba31,
          0 0 8px #ff8b1f;
      }
      .clock-ghost {
        color: #28261f;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      button.action {
        flex: 1;
        border: 0;
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      #start {
        background: #3289f5;
        color: white;
      }
      #stop {
        background: #2a3c55;
        color: white;
        border: 1px solid #536a89;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .volume {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-top: 18px;
        color: #b5c5dc;
        font-size: 0.9rem;
      }
      input[type="range"] {
        flex: 1;
        accent-color: #439bff;
      }
      .note {
        margin: 18px 0 0;
        color: #9fb3cf;
        font-size: 0.82rem;
        line-height: 1.5;
      }
      @media (max-width: 480px) {
        body {
          padding: 12px;
        }
        main {
          padding: 14px;
        }
        .clock-frame {
          padding: 12px 10px;
        }
        .clock-display,
        .clock-ghost {
          font-size: 10rem;
        }
        .controls {
          flex-direction: column;
        }
      }
      @media (max-width: 360px) {
        .clock-display,
        .clock-ghost {
          font-size: 8.75rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Velodrome Countdown</h1>

      <div class="clock-frame" role="group" aria-label="Countdown timer">
        <span class="clock-ghost" aria-hidden="true">88</span>
        <output
          id="countdown-value"
          class="clock-display"
          aria-hidden="true"
        ></output>
        <output
          id="countdown-announcement"
          class="visually-hidden"
          aria-live="polite"
          aria-atomic="true"
        ></output>
      </div>
      <div class="controls">
        <button class="action" id="start">▶ Start countdown</button>
        <button class="action" id="stop" disabled>■ Stop</button>
      </div>
      <label class="volume" for="volume"
        >Volume
        <input id="volume" type="range" min="0" max="100" value="60" /><output
          id="volumeValue"
          >60%</output
        ></label
      >
    </main>
    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const startButton = $("start");
        const stopButton = $("stop");
        const volume = $("volume");
        const volumeValue = $("volumeValue");
        const clockValue = $("countdown-value");
        const clockAnnouncement = $("countdown-announcement");

        const baseBeepFrequency = 488;
        const baseBeepDuration = 0.33;
        const countFrom = 12;
        const withEcho = true;
        const echoReflections = [
          { position: 0.25, level: 0.5 },
          { position: 0.5, level: 0.3 },
          { position: 0.75, level: 0.17 },
          { position: 1, level: 0.08 },
        ];

        const events = [
          {
            number: 30,
            frequency: baseBeepFrequency,
            duration: baseBeepDuration * 2,
          },
          {
            number: 10,
            frequency: baseBeepFrequency,
            duration: baseBeepDuration * 2,
          },
          {
            number: 5,
            frequency: baseBeepFrequency,
            duration: baseBeepDuration,
          },
          {
            number: 4,
            frequency: baseBeepFrequency,
            duration: baseBeepDuration,
          },
          {
            number: 3,
            frequency: baseBeepFrequency,
            duration: baseBeepDuration,
          },
          {
            number: 2,
            frequency: baseBeepFrequency,
            duration: baseBeepDuration,
          },
          {
            number: 1,
            frequency: baseBeepFrequency,
            duration: baseBeepDuration,
          },
          {
            number: 0,
            frequency: baseBeepFrequency * 2,
            duration: baseBeepDuration * 3,
          },
        ];
        const eventOffset = (event) => countFrom - event.number;
        const countdownDuration =
          eventOffset(events[events.length - 1]) +
          events[events.length - 1].duration;
        const zeroEvent = events.find((event) => event.number === 0);

        function setClock(seconds) {
          const digits = String(seconds).padStart(2, "0").slice(-2);
          clockValue.textContent = digits;
          clockAnnouncement.value =
            seconds + (seconds === 1 ? " second" : " seconds") + " remaining";
        }

        setClock(countFrom);

        let audioContext;
        let masterGain;
        let echoTapsByDuration = new Map();
        let echoGain;
        let runToken = 0;
        let playing = false;
        let scheduledNodes = [];
        let animationFrame = 0;
        let completionTimer = 0;

        async function ensureAudio() {
          if (!audioContext) {
            const AudioContextClass =
              window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass)
              throw new Error(
                "This browser does not support the Web Audio API.",
              );
            audioContext = new AudioContextClass();
            masterGain = audioContext.createGain();
            masterGain.gain.value = Number(volume.value) / 100;
            masterGain.connect(audioContext.destination);
            if (withEcho) {
              const echoFilter = audioContext.createBiquadFilter();
              echoFilter.type = "lowpass";
              echoFilter.frequency.value = 1300;
              echoFilter.Q.value = 0.7;
              echoGain = audioContext.createGain();
              echoGain.gain.value = 0.3;
              echoFilter.connect(echoGain);
              echoGain.connect(masterGain);
              [...new Set(events.map((event) => event.duration))].forEach(
                (duration) => {
                  const echoWindow = duration * 0.9;
                  const taps = echoReflections.map(({ position, level }) => {
                    const delayNode = audioContext.createDelay(echoWindow);
                    const tapGain = audioContext.createGain();
                    delayNode.delayTime.value = echoWindow * position;
                    tapGain.gain.value = level;
                    delayNode.connect(tapGain);
                    tapGain.connect(echoFilter);
                    return delayNode;
                  });
                  echoTapsByDuration.set(duration, taps);
                },
              );
            }
          }
          if (audioContext.state !== "running") await audioContext.resume();
        }

        function makeTone(when, frequency, duration) {
          const oscillator = audioContext.createOscillator();
          const envelope = audioContext.createGain();
          oscillator.type = "square";
          oscillator.frequency.setValueAtTime(frequency, when);

          // 8 ms attack and 25 ms release avoid clicks without changing the nominal duration.
          const peak = 0.75;
          envelope.gain.setValueAtTime(0, when);
          envelope.gain.linearRampToValueAtTime(peak, when + 0.008);
          envelope.gain.setValueAtTime(peak, when + duration - 0.025);
          envelope.gain.linearRampToValueAtTime(0, when + duration);

          oscillator.connect(envelope);
          envelope.connect(masterGain);
          if (withEcho) {
            (echoTapsByDuration.get(duration) || []).forEach((delayNode) =>
              envelope.connect(delayNode),
            );
          }
          oscillator.start(when);
          oscillator.stop(when + duration + 0.01);
          scheduledNodes.push(oscillator);
        }

        function stopCountdown() {
          runToken++;
          playing = false;
          if (animationFrame) cancelAnimationFrame(animationFrame);
          if (completionTimer) clearTimeout(completionTimer);
          scheduledNodes.forEach((node) => {
            try {
              node.stop();
            } catch (_) {}
          });
          scheduledNodes = [];
          startButton.disabled = false;
          stopButton.disabled = true;
        }

        async function startCountdown() {
          if (playing) return;
          try {
            await ensureAudio();
            stopCountdown();
            const token = runToken;
            playing = true;
            startButton.disabled = true;
            stopButton.disabled = false;
            scheduledNodes = [];

            // Schedule all tones against one audio-clock reference.
            const baseTime = audioContext.currentTime + 0.12;
            events
              .filter((event) => eventOffset(event) >= 0)
              .forEach((event) => {
                makeTone(
                  baseTime + eventOffset(event),
                  event.frequency,
                  event.duration,
                );
              });

            function updateDisplay() {
              if (!playing || token !== runToken) return;
              const elapsed = audioContext.currentTime - baseTime;
              const secondsRemaining = Math.max(
                0,
                Math.ceil(eventOffset(zeroEvent) - Math.max(0, elapsed)),
              );
              setClock(secondsRemaining);
              if (elapsed >= countdownDuration) {
                stopCountdown();
                return;
              }
              animationFrame = requestAnimationFrame(updateDisplay);
            }
            animationFrame = requestAnimationFrame(updateDisplay);
            completionTimer = setTimeout(
              () => {
                if (playing && token === runToken) stopCountdown();
              },
              (countdownDuration + 0.25) * 1000,
            );
          } catch (error) {
            stopCountdown();
            console.error(error);
          }
        }

        startButton.addEventListener("click", startCountdown);
        stopButton.addEventListener("click", () => stopCountdown());
        volume.addEventListener("input", () => {
          volumeValue.value = volume.value + "%";
          volumeValue.textContent = volume.value + "%";
          if (masterGain && audioContext) {
            masterGain.gain.setTargetAtTime(
              Number(volume.value) / 100,
              audioContext.currentTime,
              0.015,
            );
          }
        });
      })();
    </script>
  </body>
</html>
